    // --- Typewriter Custom Hook ---
    function useTypewriter(words, speed = 120, delay = 2500) {
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [currentText, setCurrentText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        let timer;
        const activeWord = words[currentWordIndex];

        if (isDeleting) {
          timer = setTimeout(() => {
            setCurrentText(activeWord.substring(0, currentText.length - 1));
          }, speed / 2);
        } else {
          timer = setTimeout(() => {
            setCurrentText(activeWord.substring(0, currentText.length + 1));
          }, speed);
        }

        if (!isDeleting && currentText === activeWord) {
          timer = setTimeout(() => setIsDeleting(true), delay);
        } else if (isDeleting && currentText === '') {
          setIsDeleting(false);
          setCurrentWordIndex((prev) => (prev + 1) % words.length);
        }

        return () => clearTimeout(timer);
      }, [currentText, isDeleting, currentWordIndex, words, speed, delay]);

      return currentText;
    }

    // --- Scroll Reveal Helper Component ---
    function ScrollReveal({ children, className = "", delay = 0 }) {
      const [isVisible, setIsVisible] = useState(false);
      const elementRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.08 }
        );

        if (elementRef.current) {
          observer.observe(elementRef.current);
        }

        return () => {
          if (elementRef.current) {
            observer.unobserve(elementRef.current);
          }
        };
      }, []);

      return (
        <div
          ref={elementRef}
          className={`transition-all duration-1000 ease-out transform ${
            isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-8 scale-[0.98]'
          } ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    }

                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-8 py-3.5 rounded-full glass hover:bg-zinc-800/40 text-white font-bold text-sm hover:scale-105 transition-transform duration-300 border-zinc-800"
                    >
                      View Credentials
                    </a>
                  </div>
                </ScrollReveal>
              </div>
            </section>

            {/* Contact Section */}
            <section id="contact" className="py-24 relative overflow-hidden">
              <div className="max-w-7xl mx-auto px-6">
                
                {/* Header Title */}
                <div className="text-center mb-16">
                  <ScrollReveal>
                    <span className="text-xs uppercase tracking-widest text-indigo-400 font-bold">Contact</span>
                    <h2 className="text-3xl sm:text-4xl font-extrabold mt-2 text-white">Get In Touch</h2>
                    <div className="w-16 h-1 bg-gradient-to-r from-violet-500 to-indigo-500 rounded mt-4 mx-auto"></div>
                  </ScrollReveal>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12 max-w-5xl mx-auto items-start">
                  
                  {/* Left Column Information */}
                  <div className="lg:col-span-5 text-left space-y-6">
                    <ScrollReveal>
                      <h3 className="text-2xl font-bold text-white mb-4">Let's Discuss Your Project</h3>
                      <p className="text-zinc-400 font-light leading-relaxed mb-8">
                        Feel free to drop a line for job opportunities, project ideas, or just to connect and share some tech thoughts. I typically respond within 24 hours.
                      </p>

                      <div className="space-y-4">
                        
                        <div className="flex items-center gap-4">
                          <div className="w-11 h-11 rounded-xl glass flex items-center justify-center border-zinc-800">
                            <Icon name="mail" className="w-5 h-5 text-violet-400" />
                          </div>
                          <div>
                            <span className="text-xs text-zinc-500 font-bold uppercase tracking-wider block">Email Address</span>
                            <a href={`mailto:${emailAddress}`} className="text-sm font-semibold text-white hover:text-violet-400 transition-colors">
                              {emailAddress}
                            </a>
                          </div>
                        </div>

                        <div className="flex items-center gap-4">
                          <div className="w-11 h-11 rounded-xl glass flex items-center justify-center border-zinc-800">
                            <Icon name="mappin" className="w-5 h-5 text-indigo-400" />
                          </div>
                          <div>
                            <span className="text-xs text-zinc-500 font-bold uppercase tracking-wider block">Current Location</span>
                            <span className="text-sm font-semibold text-white">Bengaluru, India</span>
                          </div>
                        </div>

                        <div className="flex items-center gap-4">
                          <div className="w-11 h-11 rounded-xl glass flex items-center justify-center border-zinc-800">
                            <Icon name="globe" className="w-5 h-5 text-fuchsia-400" />
                          </div>
                          <div>
                            <span className="text-xs text-zinc-500 font-bold uppercase tracking-wider block">Primary Role</span>
                            <span className="text-sm font-semibold text-white">Java Full Stack Developer</span>
                          </div>
                        </div>

                      </div>
                    </ScrollReveal>
                  </div>

                  {/* Right Form Fields */}
                  <div className="lg:col-span-7">
                    <ScrollReveal delay={150}>
                      <form onSubmit={handleFormSubmit} className="glass p-8 rounded-3xl border-zinc-800 text-left space-y-5">
                        
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                          <div>
                            <label htmlFor="name" className="text-xs font-bold uppercase tracking-wider text-zinc-400 block mb-2">Name</label>
                            <input
                              type="text"
                              id="name"
                              name="name"
                              value={formData.name}
                              onChange={handleInputChange}
                              required
                              className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-violet-500/50 text-white text-sm outline-none transition-colors"
                              placeholder="Your name"
                            />
                          </div>
                          <div>
                            <label htmlFor="email" className="text-xs font-bold uppercase tracking-wider text-zinc-400 block mb-2">Email</label>
                            <input
                              type="email"
                              id="email"
                              name="email"
                              value={formData.email}
                              onChange={handleInputChange}
                              required
                              className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-violet-500/50 text-white text-sm outline-none transition-colors"
                              placeholder="Your email address"
                            />
                          </div>
                        </div>

                        <div>
                          <label htmlFor="subject" className="text-xs font-bold uppercase tracking-wider text-zinc-400 block mb-2">Subject</label>
                          <input
                            type="text"
                            id="subject"
                            name="subject"
                            value={formData.subject}
                            onChange={handleInputChange}
                            className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-violet-500/50 text-white text-sm outline-none transition-colors"
                            placeholder="Message subject (optional)"
                          />
                        </div>

                        <div>
                          <label htmlFor="message" className="text-xs font-bold uppercase tracking-wider text-zinc-400 block mb-2">Message</label>
                          <textarea
                            id="message"
                            name="message"
                            value={formData.message}
                            onChange={handleInputChange}
                            required
                            rows="4"
                            className="w-full px-4 py-3 rounded-xl bg-zinc-900 border border-zinc-800 focus:border-violet-500/50 text-white text-sm outline-none transition-colors resize-none"
                            placeholder="Tell me about your project..."
                          ></textarea>
                        </div>

                        <button
                          type="submit"
                          disabled={isSubmitting}
                          className="w-full py-4.5 rounded-xl bg-white text-zinc-950 font-bold hover:bg-zinc-200 transition-all duration-300 disabled:opacity-50 text-sm flex items-center justify-center gap-2"
                        >
                          {isSubmitting ? (
                            <>
                              <span className="w-5 h-5 border-2 border-zinc-950 border-t-transparent rounded-full animate-spin"></span>
                              <span>Sending message...</span>
                            </>
                          ) : (
                            <>
                              <Icon name="mail" className="w-4 h-4" strokeWidth="2.5" />
                              <span>Send Message</span>
                            </>
                          )}
                        </button>

                      </form>
                    </ScrollReveal>
                  </div>

                </div>
              </div>
            </section>

          </main>

          {/* Footer block */}
          <footer className="glass border-t border-zinc-900 py-12 text-center relative z-20">
            <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6">
              
              {/* Left Brand */}
              <div className="text-left">
                <span className="text-lg font-bold text-white tracking-tight">Raju V</span>
                <p className="text-xs text-zinc-500 mt-1">Full stack Developer | Portfolio 2026</p>
              </div>

              {/* Center copyright */}
              <span className="text-xs text-zinc-500">
                &copy; 2026 Raju V. Made with 💜. All rights reserved.
              </span>

              {/* Right Socials */}
              <div className="flex gap-4">
                <a
                  href="https://github.com/Raju24042004/Nalla-Nudi"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-zinc-500 hover:text-white transition-colors"
                >
                  <Icon name="github" className="w-5 h-5" />
                </a>
                <a
                  href="https://www.linkedin.com/in/raju-v-49787a310"
                  target="_blank"
                  rel="noopener noreferrer"
                  className="text-zinc-500 hover:text-white transition-colors"
                >
                  <Icon name="linkedin" className="w-5 h-5" />
                </a>
                <a
                  href={`mailto:${emailAddress}`}
                  className="text-zinc-500 hover:text-white transition-colors"
                >
                  <Icon name="mail" className="w-5 h-5" />
                </a>
              </div>

            </div>
          </footer>

          {/* Toast Notification for Success Form Submission */}
          {submitSuccess && (
            <div className="fixed bottom-6 right-6 z-50 glass-strong border-emerald-500/30 p-4.5 rounded-2xl shadow-xl flex items-center gap-3 animate-slide-in">
              <div className="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center">
                <Icon name="check" className="w-4 h-4 text-emerald-400" strokeWidth="3" />
              </div>
              <div className="text-left">
                <h5 className="font-bold text-white text-sm">Message Sent!</h5>
                <p className="text-xs text-zinc-400 mt-0.5">Raju V will get back to you shortly.</p>
              </div>
              <button
                onClick={() => setSubmitSuccess(false)}
                className="text-zinc-500 hover:text-zinc-300 ml-4 p-1 rounded"
              >
                <Icon name="x" className="w-4 h-4" />
              </button>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
