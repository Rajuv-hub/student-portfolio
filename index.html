    // --- Dynamic Typewriter Hook ---
    function useTypewriter(words, speed = 100, delay = 2200) {
      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [currentText, setCurrentText] = useState('');
      const [isDeleting, setIsDeleting] = useState(false);

      useEffect(() => {
        let timer;
        const activeWord = words[currentWordIndex];

        if (isDeleting) {
          timer = setTimeout(() => {
            setCurrentText(activeWord.substring(0, currentText.length - 1));
          }, speed / 2);
        } else {
          timer = setTimeout(() => {
            setCurrentText(activeWord.substring(0, currentText.length + 1));
          }, speed);
        }

        if (!isDeleting && currentText === activeWord) {
          timer = setTimeout(() => setIsDeleting(true), delay);
        } else if (isDeleting && currentText === '') {
          setIsDeleting(false);
          setCurrentWordIndex((prev) => (prev + 1) % words.length);
        }

        return () => clearTimeout(timer);
      }, [currentText, isDeleting, currentWordIndex, words, speed, delay]);

      return currentText;
    }

    // --- Scroll Reveal Animation Component ---
    function ScrollReveal({ children, className = "", delay = 0 }) {
      const [isVisible, setIsVisible] = useState(false);
      const domRef = useRef(null);

      useEffect(() => {
        const observer = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
              observer.unobserve(entry.target);
            }
          },
          { threshold: 0.1 }
        );

        if (domRef.current) observer.observe(domRef.current);
        return () => {
          if (domRef.current) observer.unobserve(domRef.current);
        };
      }, []);

      return (
        <div
          ref={domRef}
          className={`transition-all duration-1000 cubic-bezier(0.16, 1, 0.3, 1) transform ${
            isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-10 scale-[0.98]'
          } ${className}`}
          style={{ transitionDelay: `${delay}ms` }}
        >
          {children}
        </div>
      );
    }
